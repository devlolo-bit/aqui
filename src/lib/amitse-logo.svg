<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Âmitse® — A Arquiteta da Autonomia da Mulher">
  <defs>
    <linearGradient id="coneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C01FF" />
      <stop offset="0.55" stop-color="#17A3D8" />
      <stop offset="1" stop-color="#00C7C7" />
    </linearGradient>
    <linearGradient id="coneBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D657" />
      <stop offset="1" stop-color="#69FF01" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69FF01" />
      <stop offset="0.45" stop-color="#17A3D8" />
      <stop offset="1" stop-color="#2C01FF" />
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C01FF" />
      <stop offset="1" stop-color="#1B1E9B" />
    </linearGradient>
    <path id="ring" d="M42 182 A152 152 0 0 1 332 92" />
    <path id="ringReverse" d="M332 92 A152 152 0 0 1 42 182" />
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Symmetric 3D ribbon orbit around the cone -->
  <g stroke-linecap="round" fill="none">
    <use href="#ring" stroke="url(#orbitGrad)" stroke-width="28" opacity="0.9" />
    <use href="#ringReverse" stroke="url(#orbitGrad)" stroke-width="28" opacity="0.9" />
  </g>
  <!-- Central abstract cone / mountain with blue-cyan gradient -->
  <polygon points="124,228 228,228 176,58" fill="url(#coneTop)" />
  <!-- Secondary facet to give depth -->
  <polygon points="176,58 228,228 200,228" fill="#1B1E9B" opacity="0.35" />
  <!-- Green base bar -->
  <rect x="92" y="236" width="168" height="20" rx="10" fill="url(#coneBase)" />
  <!-- Small colourful accents at the base -->
  <circle cx="112" cy="222" r="7" fill="#69FF01" />
  <circle cx="148" cy="232" r="6" fill="#17A3D8" />
  <circle cx="196" cy="232" r="6" fill="#F2B705" />
  <circle cx="236" cy="222" r="7" fill="#2C01FF" />
  <!-- Wordmark: Âmitse -->
  <g font-family="Sora, Inter, Arial, sans-serif" font-weight="600" font-size="120" letter-spacing="-2">
    <text x="300" y="150" fill="url(#wordGrad)">Âmitse</text>
  </g>
  <text x="578" y="86" font-family="Sora, Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="url(#wordGrad)">®</text>
  <!-- Tagline -->
  <text x="302" y="196" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="1" fill="#69FF01">A Arquiteta da Autonomia da Mulher</text>
</svg>
